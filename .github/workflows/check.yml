name: MS Rewards Restock Check

on:
  schedule:
    # Runs automatically every 5 minutes in GitHub's cloud
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send test alert to Discord'
        required: false
        type: boolean
        default: false

jobs:
  check-rewards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Restock Check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python sentinel.py --test
          else
            python sentinel.py
          fi
